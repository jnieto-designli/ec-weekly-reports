<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrepreneurs Circle — Weekly Reports</title>
<style>
  :root{--navy:#0a2540;--navy2:#123a63;--accent:#00a3e0;--accent2:#0079b8;--ink:#1c2430;--muted:#64707f;--line:#e6e9ef;--bg:#eef2f7;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 64px}
  header.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:30px 32px;box-shadow:0 10px 30px rgba(10,37,64,.30);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(0,163,224,.35),transparent 70%)}
  .brandrow{display:flex;align-items:center;gap:14px;margin-bottom:16px;position:relative;z-index:1}
  .brandrow img{height:34px}
  .brandrow .div{width:1px;height:26px;background:rgba(255,255,255,.3)}
  .brandrow .sub{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.85}
  header.top h1{margin:0;font-size:24px;position:relative;z-index:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;box-shadow:0 2px 8px rgba(20,30,60,.05);margin-top:20px}
  label{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:8px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  select{font-size:15px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:200px}
  .btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border:none;border-radius:10px;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--accent2)}
  .btn.ghost{background:#fff;color:var(--accent2);border:1px solid var(--accent)}
  h2{font-size:15px;margin:26px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  ul{list-style:none;margin:0;padding:0}
  li{border-bottom:1px solid var(--line)}
  li a{display:block;padding:13px 6px;text-decoration:none;color:var(--ink);font-weight:600}
  li:first-child a{color:var(--accent2)}
  li a:hover{color:var(--accent)}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
</style>
<link rel="stylesheet" href="aurora.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <img src="https://designli.co/hs-fs/hubfs/images/global%20components/logo/logoWhite-compressed.png?width=149&height=147&name=logoWhite-compressed.png" alt="Designli">
      <div class="div"></div>
      <span class="sub">Entrepreneurs Circle</span>
    </div>
    <h1>Weekly Progress Reports</h1>
  </header>

  <div class="card">
    <label for="picker">Choose week</label>
    <div class="row">
      <select id="picker">
        <option value="EC-Weekly-2026-06-11.html">2026-06-11</option>
      </select>
      <button class="btn" onclick="go()">View report</button>
      <a class="btn ghost" href="EC-Weekly-2026-06-11.html">Open latest →</a>
    </div>
  </div>

  <div class="card">
    <h2>History (1 report)</h2>
    <ul>
        <li><a href="EC-Weekly-2026-06-11.html">Week of 2026-06-11</a></li>
    </ul>
  </div>

  <footer>Designli · Entrepreneurs Circle · Internal document</footer>
</div>
<script>
  function go(){ var v = document.getElementById('picker').value; if(v) window.location.href = v; }
</script>
<script src="particles.js"></script>
<script src="anim.js"></script>
<script src="feedback.js"></script>
</body>
</html>
